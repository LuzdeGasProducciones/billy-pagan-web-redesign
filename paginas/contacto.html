        </p>

        <!-- Formulario básico (usa mailto para abrir el cliente de correo)
             Se incluye como funcionalidad provisional hasta que haya backend. -->
        <form action="mailto:luzdegasproducciones@gmail.com" method="post" enctype="text/plain" style="margin-top:30px;">
            <label style="display:block; margin-bottom:8px;">Nombre<br>
                <input type="text" name="Nombre" style="width:100%; padding:8px; box-sizing:border-box;">

            <label style="display:block; margin-bottom:8px;">Email<br>

            <label style="display:block; margin-bottom:8px;">Mensaje<br>
                <textarea name="Mensaje" rows="6" style="width:100%; padding:8px; box-sizing:border-box;"></textarea>
            </label>

            <p style="text-align:center; margin-top:12px;">
                <button type="submit" style="padding:10px 18px; background:var(--menu); color:#fff; border-radius:2px; text-transform:uppercase; letter-spacing:2px;">Enviar</button>
